# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate new migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, allowed to list multiple directories separated by semilons
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to use for the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow empty revisions to be created
# write_empty = false

# version locations.  specifies where version files are located
# version_locations = %(here)s/alembic/versions

# version table name
# version_locations_table = alembic_version

# version table schema
# version_locations_schema = None

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[loggers_root]
level = WARNING
handlers = console
qualname =

[loggers_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[loggers_alembic]
level = INFO
handlers =
qualname = alembic

[handlers_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
