name: Veridion Full-Stack CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt pytest httpx fastapi

    - name: Run backend Pytest unit checks
      run: |
        pytest backend/

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-size: '20'

    - name: Install frontend dependencies
      run: |
        npm ci

    - name: Verify production React build compiles
      run: |
        npm run build
