name: Procura CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Setup PostgreSQL service container
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: procura_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/procura_test
      APP_ENV: testing
      SECRET_KEY: testsecretkey
      JWT_SECRET: testjwtsecret
      PYTHONPATH: .

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt pytest httpx

    - name: Run Pytest suite (Backend & Agents)
      run: |
        pytest backend/app/tests

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      run: |
        npm ci --prefix frontend

    - name: Verify production React build compiles
      run: |
        npm run build --prefix frontend
